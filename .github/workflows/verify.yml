name: Verify PMO MVP

on:
  push:
    branches: [main, feat/pmo-mvp]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: TypeScript check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
